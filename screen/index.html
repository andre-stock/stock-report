<!DOCTYPE html><html lang="zh-Hant"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>台股篩選器</title>
<style>
body{font-family:-apple-system,'Noto Sans TC',sans-serif;margin:12px;background:#0f1115;color:#e8e8e8;font-size:14px}
h1{font-size:17px;margin:4px 0}.sub{color:#9aa0a6;font-size:12px;margin-bottom:10px}
.nav a{display:inline-block;padding:6px 14px;border:1px solid #2a2f37;border-radius:6px;margin:0 6px 8px 0;font-size:13px;background:#1a1f27;color:#c9d1d9;text-decoration:none}
.nav a.act{background:#2d6cdf;border-color:#2d6cdf;color:#fff;font-weight:600}
.card{background:#161a21;border:1px solid #2a2f37;border-radius:8px;padding:10px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #1e232b;flex-wrap:wrap}
.row:last-child{border-bottom:none}
select,input[type=number],input[type=text]{background:#0f1115;border:1px solid #2a2f37;color:#e8e8e8;border-radius:5px;padding:5px}
select{max-width:100%;font-size:13px}
input[type=number]{width:70px}
input[type=text]{width:100%}
button{background:#2d6cdf;border:none;color:#fff;border-radius:6px;padding:7px 14px;font-size:13px;font-weight:600}
button.g{background:#232a33;border:1px solid #2a2f37;color:#c9d1d9}
button.x{background:transparent;border:none;color:#8b949e;font-size:16px;padding:2px 8px}
button.mv{background:transparent;border:none;color:#8fb8ff;font-size:14px;padding:2px 6px}
.pri{display:inline-block;min-width:20px;color:#8fb8ff;font-weight:700}
table{border-collapse:collapse;width:100%;font-size:12px}
th,td{border:1px solid #2a2f37;padding:4px 6px;text-align:right;white-space:nowrap}
th{background:#1a1f27;color:#c9d1d9}
td.l,th.l{text-align:left}
.pos{color:#5ee08a}.neg{color:#ff7b72}.warn{color:#ffd166}
.note{color:#8b949e;font-size:11px;margin-top:8px;line-height:1.6}
.tiny{font-size:11px;color:#8b949e}
</style></head><body>
<h1>台股篩選器</h1>
<div class="nav"><a href="../">← 首頁</a><a href="../tw/">台股</a><a href="../us/">美股</a><a class="act">篩選器</a></div>
<div class="sub" id="meta">載入中…</div>

<div class="card">
  <div class="row">
    <select id="pick" style="flex:1 1 200px"></select>
    <button onclick="addCond()">＋ 加入條件</button>
  </div>
  <div id="list"></div>
  <div class="tiny" id="tip">加入的順序＝優先順序（第 1 條是主要排序依據）</div>
  <div class="row"><span class="tiny">族群包含（可留空）</span><input type="text" id="grp" placeholder="例：散熱、PCB、IC設計"></div>
  <div class="row" style="border:none">
    <button onclick="run()">套用</button>
    <button class="g" onclick="clearAll()">清空條件</button>
    <button class="g" onclick="save()">存配方</button>
    <button class="g" onclick="loadCfg()">載入配方</button>
    <button class="g" onclick="csv()">匯出 CSV</button>
  </div>
</div>

<div id="result"></div>
<div class="note">資料來源：證交所公開資料。均線／距52週高／量增由每日累積收盤價計算。<br>「距 52 週高」= 目前股價在 52 週高點下方幾 %（越小＝越接近新高）。本頁為客觀篩選，非投資建議。</div>

<script>
const CONDS=[
 {id:"pct", t:"漲幅 ≥", u:"%", d:3, v:s=>(s.pct==null?-99:s.pct), p:(s,x)=>s.pct!=null&&s.pct>=x},
 {id:"val", t:"成交金額 ≥", u:"億", d:2, v:s=>(s.val||0)/1e8, p:(s,x)=>((s.val||0)/1e8)>=x},
 {id:"liq", t:"成交量 ≥", u:"張", d:2000, v:s=>s.vol||0, p:(s,x)=>(s.vol||0)>=x},
 {id:"vr", t:"量增 ≥", u:"倍", d:1.5, v:s=>(s.vr==null?-99:s.vr), p:(s,x)=>s.vr!=null&&s.vr>=x},
 {id:"pmin", t:"股價 ≥", u:"元", d:20, v:s=>s.px, p:(s,x)=>s.px>=x},
 {id:"pmax", t:"股價 ≤", u:"元", d:500, v:s=>-s.px, p:(s,x)=>s.px<=x},
 {id:"d252", t:"距 52 週高 ≤", u:"%", d:5, v:s=>(s.d252==null?-99:-(100-s.d252)), p:(s,x)=>s.d252!=null&&(100-s.d252)<=x},
 {id:"ma5", t:"站上 5MA", u:"", d:0, nox:true, v:s=>(s.ma5? s.px/s.ma5-1 : -9), p:s=>s.ma5!=null&&s.px>s.ma5},
 {id:"ma20", t:"站上 20MA", u:"", d:0, nox:true, v:s=>(s.ma20? s.px/s.ma20-1 : -9), p:s=>s.ma20!=null&&s.px>s.ma20},
 {id:"ma60", t:"站上 60MA", u:"", d:0, nox:true, v:s=>(s.ma60? s.px/s.ma60-1 : -9), p:s=>s.ma60!=null&&s.px>s.ma60},
 {id:"align", t:"均線多頭排列 (5>10>20)", u:"", d:0, nox:true, v:s=>0, p:s=>s.ma5&&s.ma10&&s.ma20&&s.ma5>s.ma10&&s.ma10>s.ma20},
 {id:"f", t:"外資買超 ≥", u:"張", d:500, v:s=>(s.f==null?-99999:s.f), p:(s,x)=>s.f!=null&&s.f>=x},
 {id:"t", t:"投信買超 ≥", u:"張", d:300, v:s=>(s.t==null?-99999:s.t), p:(s,x)=>s.t!=null&&s.t>=x},
 {id:"tot", t:"三大法人買超 ≥", u:"張", d:1000, v:s=>(s.tot==null?-99999:s.tot), p:(s,x)=>s.tot!=null&&s.tot>=x},
 {id:"mag", t:"🟢賣超續強（外資賣超≥500張且漲≥5%）", u:"", d:0, nox:true, v:s=>0, p:s=>s.f!=null&&s.f<=-500&&s.pct>=5},
 {id:"loose", t:"🟡籌碼鬆動（前一日外資賣超≥500張）", u:"", d:0, nox:true, v:s=>0, p:s=>s.fp!=null&&s.fp<=-500&&s.pct>0},
 {id:"margp", t:"融資增加 ≥", u:"張", d:500, v:s=>s.marg||0, p:(s,x)=>(s.marg||0)>=x},
 {id:"excl", t:"排除 處置/注意股", u:"", d:0, nox:true, v:s=>0, p:s=>!s.disp&&!s.note}
];
const byId=id=>CONDS.find(c=>c.id===id);
let DATA=null, ACTIVE=[], LAST=[];
const el=id=>document.getElementById(id);
function fillPick(){
  el("pick").innerHTML=['<option value="">— 選擇條件 —</option>']
    .concat(CONDS.filter(c=>!ACTIVE.some(a=>a.id===c.id)).map(c=>'<option value="'+c.id+'">'+c.t+(c.nox?'':' ＿＿')+'</option>')).join("");
}
function addCond(){
  const id=el("pick").value; if(!id) return;
  const c=byId(id); ACTIVE.push({id:id, th:c.d}); render(); apply0();
}
function render(){
  fillPick();
  el("list").innerHTML = ACTIVE.length? ACTIVE.map((a,i)=>{
    const c=byId(a.id);
    return '<div class="row"><span class="pri">'+(i+1)+'</span><span style="flex:1 1 140px">'+c.t+'</span>'
      + (c.nox? '<span class="tiny">（無需數值）</span>' : '<input type="number" step="any" value="'+a.th+'" onchange="ACTIVE['+i+'].th=parseFloat(this.value)||0"><span class="tiny">'+c.u+'</span>')
      + '<button class="mv" onclick="up('+i+')">↑</button><button class="mv" onclick="down('+i+')">↓</button>'
      + '<button class="x" onclick="del('+i+')">✕</button></div>';
  }).join("") : '<div class="tiny">尚未加入條件（可只按「套用」看全市場）</div>';
}
function up(i){ if(i<=0) return; const t=ACTIVE[i-1]; ACTIVE[i-1]=ACTIVE[i]; ACTIVE[i]=t; render(); apply0(); }
function down(i){ if(i>=ACTIVE.length-1) return; const t=ACTIVE[i+1]; ACTIVE[i+1]=ACTIVE[i]; ACTIVE[i]=t; render(); apply0(); }
function del(i){ ACTIVE.splice(i,1); render(); apply0(); }
function clearAll(){ ACTIVE=[]; el("grp").value=""; render(); apply0(); }
function apply0(){
  if(ACTIVE.length) run();
  else { el("meta").textContent = DATA? "資料日期 "+DATA.date+"　全市場 "+DATA.stocks.length+" 檔　→ 未加條件（顯示全部）" : "載入中…"; el("result").innerHTML=""; }
}
function run(){
  if(!DATA) return;
  const g=el("grp").value.trim();
  let out=DATA.stocks.filter(s=>{
    if(g && !(s.g||"").includes(g)) return false;
    for(const a of ACTIVE){ const c=byId(a.id); if(!c.p(s,a.th)) return false; }
    return true;
  });
  out=out.slice().sort((A,B)=>{                       // 依加入順序＝優先順序排序
    for(const a of ACTIVE){ const c=byId(a.id); const d=c.v(B)-c.v(A); if(d) return d; }
    return 0;
  });
  LAST=out;
  el("meta").textContent="資料日期 "+(DATA.date||"-")+"　全市場 "+DATA.stocks.length+" 檔　歷史 "+DATA.hist_days+" 個交易日　→ 符合 "+out.length+" 檔";
  const rows=out.slice(0,80).map(s=>{
    const pc=s.pct>=0?"pos":"neg", fc=(s.f||0)>=0?"pos":"neg", tc=(s.tot||0)>=0?"pos":"neg";
    let flag="";
    if(s.f!=null&&s.f<=-500&&s.pct>=5) flag+="<span class='pos'>🟢續強</span> ";
    if(s.fp!=null&&s.fp<=-500&&s.pct>0) flag+="<span class='warn'>🟡鬆動</span> ";
    if(s.disp) flag+="<span class='warn'>🚫處置</span> "; else if(s.note) flag+="<span class='warn'>⚠️注意</span>";
    return "<tr><td class='l'>"+s.c+"</td><td class='l'>"+s.n+"</td><td class='l'>"+(s.g||"")+"</td>"
      +"<td>"+s.px+"</td><td class='"+pc+"'>"+(s.pct==null?"-":(s.pct>=0?"+":"")+s.pct+"%")+"</td>"
      +"<td>"+(s.vr==null?"-":s.vr+"x")+"</td><td>"+(s.d252==null?"-":(100-s.d252).toFixed(1)+"%")+"</td>"
      +"<td class='"+fc+"'>"+(s.f==null?"-":s.f)+"</td><td class='"+tc+"'>"+(s.tot==null?"-":s.tot)+"</td>"
      +"<td>"+(s.marg==null?"-":(s.marg>0?"+":"")+s.marg)+"</td><td class='l'>"+flag+"</td></tr>";
  }).join("");
  el("result").innerHTML="<div class='card'><table><tr><th class='l'>代號</th><th class='l'>名稱</th><th class='l'>族群</th><th>收盤</th><th>漲幅</th><th>量增</th><th>距52週高</th><th>外資(張)</th><th>三大(張)</th><th>融資</th><th class='l'>標記</th></tr>"+rows+"</table>"+(out.length>80?"<div class='tiny'>（只顯示前 80 檔，可用 CSV 匯出全部）</div>":"")+"</div>";
}
function cfg(){ return {list:ACTIVE.map(a=>({id:a.id,th:a.th})), grp:el("grp").value}; }
function save(){ const nm=prompt("配方名稱?","我的配方"); if(!nm) return;
  const all=JSON.parse(localStorage.getItem("tw_screen2")||"{}"); all[nm]=cfg(); localStorage.setItem("tw_screen2",JSON.stringify(all)); alert("已存："+nm); }
function allCfgs(){
  const all=JSON.parse(localStorage.getItem("tw_screen2")||"{}");
  const old=JSON.parse(localStorage.getItem("tw_screen_cfg")||"{}");   // 舊版(勾選式)配方：自動轉換
  Object.keys(old).forEach(nm=>{ if(all[nm]) return; const o=old[nm]||{}; const list=[];
    CONDS.forEach(c=>{ const v=o[c.id]; if(v&&v.on){ const th=(v.th===""||v.th==null)?c.d:parseFloat(v.th); list.push({id:c.id, th:isNaN(th)?c.d:th}); } });
    all[nm]={list:list, grp:o.grp||"", migrated:true};
  });
  return all;
}
function loadCfg(){ const all=allCfgs(); const ks=Object.keys(all);
  if(!ks.length){ alert("尚無配方"); return; }
  const nm=prompt("載入哪個配方？\n"+ks.join(" / "), ks[0]); if(!nm||!all[nm]) return;
  ACTIVE=(all[nm].list||[]).filter(a=>byId(a.id)); el("grp").value=all[nm].grp||""; render(); run(); }
function csv(){ if(!LAST.length){ alert("沒有結果"); return; }
  const h="code,name,group,px,pct,ma5,ma20,ma60,d252,vr,f,t,tot,marg,note,disp";
  const b=LAST.map(s=>[s.c,s.n,s.g,s.px,s.pct,s.ma5,s.ma20,s.ma60,s.d252,s.vr,s.f,s.t,s.tot,s.marg,s.note,s.disp].join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([h+"\n"+b],{type:"text/csv"})); a.download="screen_"+(DATA.date||"")+".csv"; a.click(); }
render();
fetch("../data/screen.json").then(r=>r.json()).then(d=>{ DATA=d;
  if(!d.stocks||!d.stocks.length){ el("meta").textContent="尚無資料（日報產生後即可使用）"; return; }
  el("meta").textContent="資料日期 "+(d.date||"-")+"　全市場 "+d.stocks.length+" 檔　歷史 "+d.hist_days+" 個交易日"; })
 .catch(e=>{ el("meta").textContent="載入失敗："+e; });
</script></body></html>
