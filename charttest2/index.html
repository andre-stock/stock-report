<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{margin:0;background:#0f1115}</style></head><body>
<div id="c" style="height:520px;width:100%"></div>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
fetch('https://andre-stock.github.io/stock-report/data/tw_bars/2.json?t='+Date.now()).then(r=>r.json()).then(function(d){
  var bars=d['2330'];
  var box=document.getElementById('c');
  var ch=LightweightCharts.createChart(box,{width:1200,height:520,layout:{background:{type:'solid',color:'#0f1115'},textColor:'#c9d1d9'},grid:{vertLines:{color:'#1a1f27'},horzLines:{color:'#1a1f27'}},rightPriceScale:{borderColor:'#2a2f37'},timeScale:{borderColor:'#2a2f37'}});
  var cs=ch.addCandlestickSeries({upColor:'#f6465d',downColor:'#0ecb81',borderUpColor:'#f6465d',borderDownColor:'#0ecb81',wickUpColor:'#f6465d',wickDownColor:'#0ecb81'});
  cs.setData(bars.map(function(b){return {time:b[0].slice(0,4)+'-'+b[0].slice(4,6)+'-'+b[0].slice(6,8),open:b[1],high:b[2],low:b[3],close:b[4]};}));
  var v=ch.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:''});
  v.priceScale().applyOptions({scaleMargins:{top:0.82,bottom:0}});
  v.setData(bars.map(function(b){return {time:b[0].slice(0,4)+'-'+b[0].slice(4,6)+'-'+b[0].slice(6,8),value:b[5],color:(b[4]>=b[1]?'rgba(246,70,93,.45)':'rgba(14,203,129,.45)')};}));
  ch.timeScale().fitContent();
  document.title='OK '+bars.length;
}).catch(function(e){document.title='ERR '+e;});
</script></body></html>
